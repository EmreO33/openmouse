# Cloudflare Pages Functions configuration.
# Once this file exists, Pages treats it as part of the project config, so it
# must keep the build output directory that the dashboard expects.
#
# Secrets (DISCORD_FEEDBACK_WEBHOOK) stay as encrypted dashboard environment
# variables — never commit them here.
#
# NOTE: SECURITY_KV and PRESENCE_KV are configured in the Cloudflare dashboard
# and must remain bound for the security middleware and presence telemetry to
# work. After the next deploy, confirm they are still attached. If the
# dashboard person prefers everything in this file, run
#   npx wrangler pages download config <project-name>
# which regenerates this file using the real namespace IDs, then re-add:
#   [ai]
#   binding = "AI"

pages_build_output_dir = "./dist"

[ai]
binding = "AI"